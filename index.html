<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小费计算器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>小费计算器</h1>
      <p class="subtitle">输入账单金额和小费比例，自动计算小费与总金额</p>

      <label for="bill">账单金额</label>
      <input type="number" id="bill" placeholder="例如：50" min="0" step="0.01">

      <label for="tip">小费比例</label>
      <input type="number" id="tip" placeholder="例如：15" min="0" step="1">

      <div class="result">
        <p>小费金额：<strong id="tipAmount">$0.00</strong></p>
        <p>总金额：<strong id="totalAmount">$0.00</strong></p>
      </div>

      <button id="clearBtn">清空</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
