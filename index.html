<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小费计算器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="badge">Tip Calculator</div>

      <h1>小费计算器</h1>
      <p class="subtitle">快速计算小费、总金额，还能按人数平摊</p>

      <label for="bill">账单金额</label>
      <div class="input-wrap">
        <span>$</span>
        <input type="number" id="bill" placeholder="例如：50" min="0" step="0.01">
      </div>

      <label for="tip">小费比例</label>
      <div class="tip-buttons">
        <button type="button" class="tip-btn" data-tip="10">10%</button>
        <button type="button" class="tip-btn active" data-tip="15">15%</button>
        <button type="button" class="tip-btn" data-tip="20">20%</button>
      </div>

      <div class="input-wrap">
        <span>%</span>
        <input type="number" id="tip" value="15" placeholder="例如：15" min="0" step="1">
      </div>

      <label for="people">平摊人数</label>
      <div class="input-wrap">
        <span>人</span>
        <input type="number" id="people" value="1" min="1" step="1">
      </div>

      <div class="result">
        <div>
          <span>小费金额</span>
          <strong id="tipAmount">$0.00</strong>
        </div>
        <div>
          <span>总金额</span>
          <strong id="totalAmount">$0.00</strong>
        </div>
        <div>
          <span>每人支付</span>
          <strong id="perPersonAmount">$0.00</strong>
        </div>
      </div>

      <button id="clearBtn" class="clear-btn">清空</button>

      <footer>Made by cy021030-boop</footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
